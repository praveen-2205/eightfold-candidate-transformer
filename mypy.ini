[mypy]
python_version = 3.10
warn_return_any = True
warn_unused_configs = True
ignore_missing_imports = True
check_untyped_defs = True
disallow_untyped_calls = False

# Specifically ignore missing stubs for third-party libraries
[mypy-rapidfuzz.*]
ignore_missing_imports = True

[mypy-phonenumbers.*]
ignore_missing_imports = True

[mypy-pypdf.*]
ignore_missing_imports = True