[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "candidate-transformer"
version = "0.1.0"
description = "Multi-Source Candidate Data Transformer"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pypdf>=3.0",
    "phonenumbers>=8.0",
    "python-dateutil>=2.8",
    "pycountry>=23.0",
    "rapidfuzz>=3.0"
]

[project.scripts]
candidate-transformer = "candidate_transformer.cli:main"